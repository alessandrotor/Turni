# Pubblicazione della PRODUZIONE su un hosting Apache europeo (oggi IONOS,
# da gennaio 2027 forse Aruba o simili), via SFTP. La produzione parte SOLO a
# mano: GitHub → Actions → «Pubblica su hosting europeo» → Run workflow. Così
# gli utenti non vedono cambiamenti a sorpresa, come col deploy manuale di prima.
#
# PERCHÉ UN HOSTING EUROPEO (novembre 2026): chi mantiene il progetto vuole i
# server solo in UE e un canone fisso. Cloudflare resta per il sito di prova
# (deploy-test.yml) e per Beta, dove non ci sono utenti veri.
#
# Richiede, in Settings → Secrets and variables → Actions:
#   - Secret   IONOS_SFTP_HOST       → l'host SFTP del pannello (access-….webspace-host.com)
#   - Secret   IONOS_SFTP_USER       → l'utente SFTP
#   - Secret   IONOS_SFTP_PASSWORD   → la sua password (la mette solo chi mantiene il progetto)
#   - Variable IONOS_CARTELLA        → la cartella del sito sul server (default: segnaturni);
#                                      è quella a cui punta il dominio nel pannello
#   - Variable SITO_PRODUZIONE       → l'indirizzo pubblico, es. https://segnaturni.it
#                                      (serve all'anteprima dei link condivisi)
# Cambiare hosting vuol dire cambiare questi valori, non questo file: i nomi
# dicono IONOS per storia, valgono per qualunque SFTP.
#
# GLI HEADER: Apache non legge `_headers` ma `.htaccess`, che qui si GENERA da
# `_headers` (scripts/genera-htaccess.mjs). Una fonte sola: chi cambia la CSP
# la cambia per tutti e due. → check-htaccess.mjs
#
# L'ORDINE DEL CARICAMENTO: prima tutto tranne le pagine e il service worker,
# poi quelli. Un `index.html` nuovo che arriva prima dei suoi file in
# /assets/ è una pagina bianca per chi apre il sito in quel momento.
# `--delete` toglie i file della versione prima, come fa Pages: chi ha
# l'app installata li ha già nel precache.

name: Pubblica su hosting europeo (SFTP)

# DUE USI. Premuto a mano (workflow_dispatch) pubblica la PRODUZIONE nella
# cartella IONOS_CARTELLA. A ogni push su `experimental` pubblica invece la
# PROVA in IONOS_CARTELLA_PROVA (default: segnaturni-prova), come
# deploy-test.yml fa su Cloudflare: serve a provare l'hosting europeo con la
# versione più recente, con robots.txt che chiude la porta ai motori di
# ricerca. Finché i segreti non ci sono, il push salta il caricamento senza
# diventare rosso: il pulsante a mano invece fallisce e lo dice.

on:
  push:
    branches: [experimental]
  workflow_dispatch:
    inputs:
      ramo:
        description: 'Ramo da pubblicare'
        required: true
        default: Beta

permissions:
  contents: read

concurrency:
  group: sftp-${{ github.event_name }}
  cancel-in-progress: false

env:
  PROVA: ${{ github.event_name == 'push' }}
  RAMO: ${{ inputs.ramo || github.ref_name }}
  CARTELLA: ${{ github.event_name == 'push' && (vars.IONOS_CARTELLA_PROVA || 'segnaturni-prova') || (vars.IONOS_CARTELLA || 'segnaturni') }}
  SITO: ${{ github.event_name == 'push' && vars.SITO_PROVA || vars.SITO_PRODUZIONE }}

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ramo || github.ref_name }}

      # Il generatore del .htaccess si prende dal ramo che contiene QUESTO
      # file (il ramo predefinito), non da quello da pubblicare: così si può
      # pubblicare anche un ramo che non lo ha ancora. Gli header invece
      # vengono dal `_headers` del ramo pubblicato.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .strumenti
          sparse-checkout: scripts/genera-htaccess.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SITE_URL: ${{ env.SITO }}
          # Come sul sito di prova Cloudflare: la pagina Statistiche la vedono i tester.
          VITE_BETA_STATS: ${{ env.PROVA == 'true' && 'true' || '' }}

      - name: Riscontri (bloccano la pubblicazione se uno fallisce)
        run: |
          if [ -f scripts/riscontri.mjs ]; then npm run riscontri
          else echo "Il ramo non ha scripts/riscontri.mjs: riscontri saltati." | tee -a "$GITHUB_STEP_SUMMARY"; fi

      - name: File che su Pages arrivavano da sé
        run: |
          node .strumenti/scripts/genera-htaccess.mjs dist
          rm -rf .strumenti
          # Su Pages robots.txt è una Function (functions/robots.txt.js).
          if [ "$PROVA" = true ]; then printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
          else printf 'User-agent: *\nAllow: /\n' > dist/robots.txt; fi
          # `_headers` qui non serve a niente: non lo si pubblica.
          rm -f dist/_headers

      - name: Caricamento via SFTP
        env:
          HOST: ${{ secrets.IONOS_SFTP_HOST }}
          UTENTE: ${{ secrets.IONOS_SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
        run: |
          if [ -z "$HOST" ] || [ -z "$UTENTE" ] || [ -z "$LFTP_PASSWORD" ]; then
            echo "Mancano i segreti IONOS_SFTP_HOST, IONOS_SFTP_USER o IONOS_SFTP_PASSWORD." | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$PROVA" = true ]; then exit 0; else exit 1; fi
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp --env-password -u "$UTENTE" "sftp://$HOST" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            mkdir -p -f $CARTELLA;
            mirror -R --verbose=1 --exclude-glob *.html --exclude-glob sw.js --exclude-glob manifest.webmanifest dist $CARTELLA;
            mirror -R --verbose=1 --delete dist $CARTELLA;
            bye"

      - name: Riepilogo
        run: |
          echo "Ramo $RAMO → cartella $CARTELLA. Indirizzo: ${SITO:-(non impostato)}" >> "$GITHUB_STEP_SUMMARY"
