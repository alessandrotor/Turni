# Auto-deploy dell'AMBIENTE DI TEST su ogni push del branch di lavoro `experimental`.
# La PRODUZIONE resta manuale (deploy su --branch main lanciato a mano dal branch
# git `main`), così i tester non vedono cambiamenti a sorpresa. Vedi memory/web-deploy.md.
#
# Richiede queste impostazioni nel repo GitHub (Settings → Secrets and variables → Actions):
#   - Secret   CLOUDFLARE_API_TOKEN     → token Cloudflare con permesso "Cloudflare Pages: Edit"
#
# La lettura con l'IA è sospesa (novembre 2026): la build non riceve più
# VITE_AI_PROXY_URL né VITE_TURNSTILE_SITEKEY, così i loro indirizzi non finiscono
# nel pacchetto. Le variabili restano nel repo. Per riaccenderla: rimetterle qui
# sotto, nella CSP (public/_headers), nell'informativa e in check-dati-in-uscita.mjs;
# la storia dei due proxy e dell'ordine di Turnstile è nella cronologia di questo file.

name: Deploy TEST (Cloudflare Pages)

on:
  push:
    branches: [experimental]

permissions:
  contents: read

concurrency:
  group: pages-test
  cancel-in-progress: true

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # La pagina Statistiche è spenta di default (vedi src/config/features.js):
          # il default vale per la PRODUZIONE, che si costruisce a mano e dove una
          # variabile dimenticata non deve pubblicare una pagina non decisa. Qui
          # invece si accende, perché i tester la devono vedere.
          VITE_BETA_STATS: 'true'
          # L'anteprima del link deve puntare a QUESTO sito, non alla
          # produzione: altrimenti un link di prova condiviso in chat mostra
          # (o non mostra) l'immagine di un altro ambiente.
          VITE_SITE_URL: 'https://test.turni-9vr.pages.dev'

      # IL CANCELLO. Senza questo passo i riscontri esistevano ma non fermavano
      # niente: li lanciava chi se ne ricordava. Ora un riscontro rosso
      # lascia il sito di prova com'era. Girano anche con l'orologio spostato
      # (vedi scripts/riscontri.mjs), e `check-dati-in-uscita` controlla il
      # pacchetto appena costruito qui sopra, coi segreti della CI.
      - name: Riscontri (bloccano il deploy se uno fallisce)
        run: npm run riscontri

      - name: Deploy su Pages (branch test)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: efda5a39e3e8644a9398645ea4b8cfac
          command: pages deploy dist --project-name turni --branch test
