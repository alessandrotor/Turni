# Auto-deploy dell'AMBIENTE DI TEST su ogni push del branch di lavoro `experimental`.
# La PRODUZIONE resta manuale (deploy su --branch main lanciato a mano dal branch
# git `main`), così i tester non vedono cambiamenti a sorpresa. Vedi memory/web-deploy.md.
#
# Richiede queste impostazioni nel repo GitHub (Settings → Secrets and variables → Actions):
#   - Secret   CLOUDFLARE_API_TOKEN     → token Cloudflare con permesso "Cloudflare Pages: Edit"
#   - Variable VITE_AI_PROXY_URL_TEST   → https://turni-ai-proxy-test.magnaopa.workers.dev
#   - Variable VITE_AI_PROXY_URL        → proxy di PRODUZIONE, usato solo come ripiego
#   - Variable VITE_TURNSTILE_SITEKEY   → sitekey Turnstile (pubblico, non è un segreto)
#
# I DUE PROXY. Il sito di prova parla con un worker suo, che ha una chiave
# Gemini di un progetto Google diverso. Senza, un ciclo di prove esaurirebbe il
# tetto di 300 riconoscimenti al giorno CONDIVISO e spegnerebbe l'import agli
# utenti veri fino a mezzanotte, senza che sia stato speso un centesimo.
#
# Il ripiego su VITE_AI_PROXY_URL non è pigrizia: permette di introdurre il
# secondo worker senza finestre di rotture. Finché la variabile _TEST non
# esiste, il sito di prova continua a usare il proxy di produzione come ha
# sempre fatto; nel momento in cui la si crea, il passaggio avviene al deploy
# successivo. Da creare SOLO dopo che il worker di prova ha la sua chiave,
# altrimenti l'import di prova parla con un proxy che risponde
# «Proxy non configurato».
# (L'account id non è segreto ed è scritto qui sotto.)
#
# ORDINE DA RISPETTARE quando si attiva Turnstile: PRIMA questa variabile, POI il
# secret sul worker. Al contrario il worker pretenderebbe un token che l'app non
# manda, e l'import si romperebbe per tutti. Con la variabile vuota tutto continua
# a funzionare come se Turnstile non ci fosse.

name: Deploy TEST (Cloudflare Pages)

on:
  push:
    branches: [experimental]

permissions:
  contents: read

concurrency:
  group: pages-test
  cancel-in-progress: true

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build (telemetria OFF — VITE_TELEMETRY_URL volutamente non impostata)
        run: npm run build
        env:
          VITE_AI_PROXY_URL: ${{ vars.VITE_AI_PROXY_URL_TEST || vars.VITE_AI_PROXY_URL }}
          VITE_TURNSTILE_SITEKEY: ${{ vars.VITE_TURNSTILE_SITEKEY }}
          # La pagina Statistiche è spenta di default (vedi src/config/features.js):
          # il default vale per la PRODUZIONE, che si costruisce a mano e dove una
          # variabile dimenticata non deve pubblicare una pagina non decisa. Qui
          # invece si accende, perché i tester la devono vedere.
          VITE_BETA_STATS: 'true'
          # L'anteprima del link deve puntare a QUESTO sito, non alla
          # produzione: altrimenti un link di prova condiviso in chat mostra
          # (o non mostra) l'immagine di un altro ambiente.
          VITE_SITE_URL: 'https://test.turni-9vr.pages.dev'

      - name: Deploy su Pages (branch test)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: efda5a39e3e8644a9398645ea4b8cfac
          command: pages deploy dist --project-name turni --branch test
